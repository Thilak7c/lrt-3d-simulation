<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Railgrid · Kelana Jaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one station as a bright isometric diorama; white cards float over it (site panel right, tracker + live list along the bottom). */
:root{
  --bg:#E8EBF4; --panel:rgba(255,255,255,.96); --ink:#141A2E; --ink2:#4A5268; --ink3:#8A91A6; --line:#ECEEF4; --line2:#DFE3EC; --soft:#F5F6FA;
  --blue:#2F54EB; --blue-soft:#EAF0FF; --green:#15803D; --green-bar:#22C55E; --green-soft:#E5F6EC; --amber:#B45309; --amber-soft:#FFF1DB;
  --red:#DC2626; --red-soft:#FDECEC; --kj:#E0115F; --r:14px;
  --shadow:0 10px 30px rgba(28,40,90,.10),0 1px 2px rgba(28,40,90,.06);
  --f:"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.35 var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#view{position:fixed;inset:0}
#view canvas{display:block}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* top bar */
#top{position:fixed;z-index:20;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand small{font-size:10px;font-weight:700;color:#fff;background:var(--kj);border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:3px;letter-spacing:.04em}
.search{position:relative;width:340px;min-width:0;flex:0 1 340px}
.search input{width:100%;height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--soft);padding:0 34px 0 36px;outline:none}
.search input:focus{border-color:var(--blue);background:#fff}
.search>svg{position:absolute;left:12px;top:11px;color:var(--ink3);pointer-events:none}
.search kbd{position:absolute;right:9px;top:9px;font:600 11px var(--f);color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;background:#fff}
.pop{position:absolute;top:calc(100% + 6px);z-index:40;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px rgba(28,40,90,.16);padding:6px;min-width:260px;max-height:60vh;overflow:auto}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px}
.pop .it:hover,.pop .it.on{background:var(--soft)}
.pop .it small{display:block;color:var(--ink3);font-size:11px}
.pop .hd{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px 10px 4px}
.spacer{flex:1}
.site{position:relative}
.site>button{display:flex;align-items:center;gap:10px;height:44px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:0 10px 0 6px}
.site>button:hover{border-color:#C9CFDD}
.site .code{background:var(--blue);color:#fff;font-weight:700;font-size:11px;border-radius:7px;padding:5px 7px}
.site .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.site .tx b{font-size:13.5px}
.site .tx span{font-size:11px;color:var(--ink3)}
.live{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12.5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green-bar);box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}
#bellN{position:absolute;top:5px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.user{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2F54EB,#E0115F);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.user b{display:block;font-size:13px}
.user span{display:block;font-size:11px;color:var(--ink3)}
.alert{display:grid;grid-template-columns:8px 1fr;gap:2px 10px;padding:8px 10px;border-radius:8px}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:5px}
.alert span{grid-column:2;color:var(--ink3);font-size:11.5px}

/* KPI cards */
#kpis{position:fixed;z-index:10;top:72px;left:16px;display:flex;gap:10px}
.kpi{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;min-width:200px}
.kpi .ic{width:42px;height:42px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.kpi label{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.kpi .d{font-size:11.5px;font-weight:700;color:var(--green)}
.kpi .d.down{color:var(--red)}
.kpi small{display:block;font-size:11px;color:var(--ink3)}

/* map controls */
#nav{position:fixed;z-index:10;top:72px;right:368px;display:flex;flex-direction:column;padding:4px;gap:2px}
#nav button{width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
#nav button:hover{background:var(--soft);color:var(--ink)}
#nav button[aria-pressed="true"]{background:var(--blue);color:#fff}
#nav hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:auto}

/* right panel */
#panel{position:fixed;z-index:10;top:72px;right:16px;width:340px;max-height:calc(100% - 72px - 236px);overflow:auto;padding:16px}
.ph{display:flex;gap:12px;align-items:flex-start}
.ph .ic{width:44px;height:44px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.ph .eb{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.ph h2{margin:1px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.ph .ad{font-size:12px;color:var(--ink3)}
.ph .act{margin-left:auto;display:flex;gap:4px}
.ph .act button{width:30px;height:30px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.ph .act button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.prow{display:flex;align-items:center;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.prow span.m{font-size:12px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--soft);border-radius:10px;padding:9px 11px}
.st label{display:block;font-size:11px;color:var(--ink3);font-weight:600}
.st b{display:block;font-size:17px;font-weight:800;margin-top:1px;white-space:nowrap}
.st b small{font-size:12px;color:var(--ink3);font-weight:600}
.bar{height:5px;border-radius:3px;background:#E3E6EE;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar i.g{background:var(--green-bar)} .bar i.a{background:#F59E0B} .bar i.r{background:var(--red)}
.sec{margin-top:16px}
.sec h4{display:flex;justify-content:space-between;margin:0 0 4px;font-size:12.5px;font-weight:700}
.sec h4 span{font-weight:500;color:var(--ink3);font-size:11.5px}
.fr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr .fi{width:30px;height:30px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.fr .nm{flex:1;min-width:0}
.fr .nm b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .nm small{display:block;color:var(--ink3);font-size:11px}
.fr .n{font-weight:700;min-width:38px;text-align:right}
.fr .mb{width:64px;flex:none}
.fr .mb .bar{margin:0}
.fr.click{cursor:pointer;border-radius:8px}
.fr.click:hover{background:var(--soft)}
.dw{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 2px;position:relative}
.dw::before{content:"";position:absolute;left:12.5%;right:12.5%;top:8px;height:2px;background:#E3E6EE}
.dw div{position:relative;text-align:center;font-size:10.5px;color:var(--ink3);font-weight:600}
.dw div i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 5px;background:#fff;border:2px solid #D4D9E4;position:relative}
.dw div.done i{background:var(--blue);border-color:var(--blue)}
.dw div.on i{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,84,235,.18)}
.dw div.on{color:var(--ink)}
.hint{color:var(--ink3);font-size:11.5px;margin-top:12px}

/* tracker */
#tracker{position:fixed;z-index:10;left:16px;bottom:16px;width:min(800px,calc(100% - 432px));display:flex;gap:16px;padding:14px 16px;align-items:stretch}
#tracker .tl{flex:1;min-width:0}
#tracker h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;font-weight:800}
#tracker h3 .ic{color:var(--blue);display:flex}
#tracker h3 span{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(5,1fr)}
.step{position:relative;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink2);padding-top:40px;line-height:1.25}
.step i{position:absolute;top:0;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#fff;border:2px solid #D4D9E4;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:var(--ink3);z-index:1}
.step::after{content:"";position:absolute;top:14px;left:calc(50% + 15px);right:calc(-50% + 15px);height:2px;background:#E3E6EE}
.step:last-child::after{display:none}
.step.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done::after{background:var(--blue)}
.step.on i{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 5px rgba(47,84,235,.16);width:34px;height:34px;margin-left:-17px;top:-2px}
.step small{display:block;font-weight:500;color:var(--ink3);font-size:10.5px;margin-top:2px}
.step.on small{color:var(--blue);font-weight:700}
#tcard{width:250px;flex:none;border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;background:#fff;text-align:left}
#tcard:hover{border-color:#C9CFDD}
#tcard .tim{width:54px;height:54px;border-radius:10px;background:linear-gradient(180deg,#FDF2F7,#F4F5FA);display:flex;align-items:center;justify-content:center;flex:none}
#tcard b{display:block;font-size:13.5px}
#tcard small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tcard .pill{margin:5px 0}
#tcard .chev{margin-left:auto;color:var(--ink3)}

/* live list */
#list{position:fixed;z-index:10;right:16px;bottom:16px;width:400px;height:208px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-weight:600;font-size:12px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,40,90,.12)}
.seg button span{color:var(--ink3);font-weight:500;margin-left:3px}
.tabs .where{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600}
.rows{flex:1;overflow:auto;padding:0 6px 6px}
.lr{display:grid;grid-template-columns:76px 1fr 92px 70px;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.lr:hover{background:var(--soft)}
.lr.sel{background:var(--blue-soft)}
.lr b{display:block;font-size:12.5px}
.lr small{display:block;font-size:10.5px;color:var(--ink3)}
.lr .loc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .loc i{width:7px;height:7px;border-radius:50%;flex:none}
.lr .pr{font-size:11px;color:var(--ink3);text-align:right}
.lr .pr .bar{margin:0 0 3px}

/* 3D labels */
.chip3d{transform:translateY(-14px);display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;font-size:12px;padding:4px 9px;border-radius:7px;box-shadow:0 6px 16px rgba(47,84,235,.35);white-space:nowrap;pointer-events:none}
.chip3d span{font-weight:500;opacity:.85}
.chip3d.hov{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(28,40,90,.18)}
.chip3d.hov span{color:var(--ink3);opacity:1}

#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;color:var(--ink2);transition:opacity .4s}
#loader .b{width:160px;height:4px;border-radius:2px;background:#D9DDE8;overflow:hidden}
#loader .b i{display:block;width:40%;height:100%;background:var(--blue);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:101;background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);max-width:420px;display:none}

@media (max-width:1280px){ .kpi:nth-child(3){display:none} .user .tx{display:none} }
@media (max-width:1000px){ #kpis,#tracker,.search{display:none} #list{left:16px;width:auto} #panel{max-height:calc(100% - 72px - 236px)} }
@media (max-width:640px){ #panel{left:16px;width:auto;right:16px;max-height:38vh} #nav{right:16px;top:auto;bottom:236px} .site .tx span,.user{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="view"></div>

<header id="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#2F54EB"/><rect x="8" y="6" width="14" height="13" rx="3.5" fill="#fff"/><rect x="10" y="9" width="10" height="4" rx="1" fill="#2F54EB"/><rect x="8" y="15" width="14" height="1.6" fill="#E0115F"/><path d="M11 19l-2 4M19 19l2 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Railgrid<small>KV</small></span>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search trains, platforms, facilities…" aria-label="Search">
    <kbd>/</kbd>
    <div id="qres" class="pop" hidden style="left:0;width:100%"></div>
  </div>
  <div class="spacer"></div>
  <div class="site">
    <button id="siteBtn" aria-haspopup="true"><span class="code">KJ24</span><span class="tx"><b>Kelana Jaya</b><span id="siteSub">–</span></span><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div id="sitePop" class="pop" hidden style="right:0"></div>
  </div>
  <span class="live num" id="clock">Live --:--</span>
  <div style="position:relative">
    <button class="iconbtn" id="bellBtn" aria-label="Alerts" aria-haspopup="true"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><span id="bellN" hidden>0</span></button>
    <div id="alertPop" class="pop" hidden style="right:0;width:340px"></div>
  </div>
  <div class="user"><div class="avatar">SC</div><div class="tx"><b>Station Control</b><span>Duty controller · KJ24</span></div></div>
</header>

<section id="kpis">
  <div class="kpi card"><span class="ic" id="ki1"></span><div><label>Passengers in station</label><div class="v num"><span id="kv1">–</span><span class="d" id="kd1"></span></div><small>now · KJ24 Kelana Jaya</small></div></div>
  <div class="kpi card"><span class="ic" id="ki2"></span><div><label>Trains this hour</label><div class="v num"><span id="kv2">–</span><span class="d" id="kd2"></span></div><small>both directions</small></div></div>
  <div class="kpi card"><span class="ic" id="ki3"></span><div><label>On-time arrivals</label><div class="v num"><span id="kv3">–</span><span class="d" id="kd3"></span></div><small>today · within ±60 s</small></div></div>
</section>

<div id="nav" class="card" role="toolbar" aria-label="Map controls">
  <button id="zIn" aria-label="Zoom in"></button><button id="zOut" aria-label="Zoom out"></button><hr>
  <button id="rL" aria-label="Rotate left"></button><button id="rR" aria-label="Rotate right"></button><hr>
  <button id="home" aria-label="Reset view"></button><hr>
  <button id="cine" aria-label="Cinematic orbit" aria-pressed="false"></button>
</div>

<aside id="panel" class="card" aria-live="polite"></aside>

<section id="tracker" class="card">
  <div class="tl"><h3><span class="ic" id="trIc"></span>Train Tracker<span id="trHead"></span></h3><div class="steps" id="steps"></div></div>
  <button id="tcard"></button>
</section>

<section id="list" class="card">
  <div class="tabs"><div class="seg" role="tablist" id="seg"></div><span class="where">Kelana Jaya</span></div>
  <div class="rows" id="rows"></div>
</section>

<div id="loader"><div>Loading Kelana Jaya station…</div><div class="b"><i></i></div></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* =====================================================================
   HELPERS, TIME, DEMAND
   ===================================================================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
const R=rng(2024);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pct=v=>Math.round(clamp(v,0,1)*100);

  const tr={...q,s:0,v:VMAX,state:'approach',dt:0,dw:DW(SIM.t),load,alight:Math.round(load*CAP_T*(.1+R()*.18)),boarded:0,tA:0,arrAt:null,depAt:null,obj:makeTrain()};

  const p=PL[tr.pl];
  if(tr.state==='approach'){ const d=STOP-tr.s; const vt=Math.min(VMAX,Math.sqrt(2*DEC*Math.max(0,d))); tr.v=tr.v<vt?Math.min(vt,tr.v+ACC*dt):vt; tr.v=Math.max(tr.v,d>.5?.4:0); tr.s=Math.min(STOP,tr.s+tr.v*dt);

  else { tr.v=Math.min(VMAX,tr.v+ACC*dt); tr.s+=tr.v*dt; }

// facilities (static state; would come from the SCADA/maintenance feed)
const FAC=[
  {id:'E1',type:'esc',name:'Escalator E1',where:'Entrance A → concourse',ok:true},
  {id:'E2',type:'esc',name:'Escalator E2',where:'Concourse → Entrance A',ok:true},
  {id:'E3',type:'esc',name:'Escalator E3',where:'Concourse → platform',ok:true},
  {id:'E4',type:'esc',name:'Escalator E4',where:'Platform → concourse',ok:false,note:'Scheduled maintenance'},
  {id:'E5',type:'esc',name:'Escalator E5',where:'Entrance B → concourse',ok:true},
  {id:'E6',type:'esc',name:'Escalator E6',where:'Concourse → Entrance B',ok:true},
  {id:'L1',type:'lift',name:'Lift L1',where:'Street ↔ concourse',ok:true},
  {id:'L2',type:'lift',name:'Lift L2',where:'Concourse ↔ platform',ok:true},
  ...[...Array(16)].map((_,i)=>({id:`G${i+1}`,type:'gate',name:`Fare gate ${i+1}`,where:'Paid area',ok:i!==11,note:i===11?'Card reader fault':''})),
  ...[...Array(6)].map((_,i)=>({id:`T${i+1}`,type:'ticket',name:`Ticket machine ${i+1}`,where:'Concourse',ok:true})),
];
const facCount=t=>{ const f=FAC.filter(x=>x.type===t); return [f.filter(x=>x.ok).length,f.length]; };
const FAC_GROUPS=[['esc','Escalators'],['lift','Lifts'],['gate','Fare gates'],['ticket','Ticket machines']];

function trainStatus(tr){ if(tr.state==='approach') return ['Arriving','info']; if(tr.state==='dwell') return [PHASES[dwellPhase(tr)],dwellPhase(tr)===2?'ok':'info']; return ['Departed','']; }
function busStatus(b){ return {in:'Arriving',dwell:'At bay',out:'Departing',off:'En route'}[b.state]; }
const inStation=()=>PL[1].wait+PL[2].wait+STATS.flow+ENTRY_RATE*demand(hourOf(SIM.t))*45;
const busyPl=()=>[1,2].filter(k=>TRAINS.some(t=>t.pl===k&&(t.state==='dwell'||(t.state==='approach'&&etaOf(t)<45)))).length;
const crowd=w=>w<120?['Normal','ok']:w<260?['Busy','warn']:['Crowded','bad'];
const trainsInHour=t=>Math.round(integrate(t-3600,t,x=>2/headway(x)));
function alerts(){ const a=[]; for(const f of FAC) if(!f.ok) a.push({c:'#F59E0B',t:`${f.name} out of service`,s:`${f.where} · ${f.note||''}`});
  for(const l of STATS.late) a.push({c:'#DC2626',t:`${l.id} arrived ${fmtDelay(l.late)} late`,s:`Platform ${l.pl} · ${hm(l.t)}`});
  for(const k of [1,2]) if(PL[k].wait>=260) a.push({c:'#DC2626',t:`Platform ${k} crowded`,s:`${fmtN(PL[k].wait)} waiting`}); return a; }

const stat=(label,val,frac,cls='')=>`<div class="st"><label>${label}</label><b class="num">${val}</b>${frac==null?'':`<div class="bar"><i class="${cls}" style="width:${pct(frac)}%"></i></div>`}</div>`;
const head=(eb,title,sub,icon,act='')=>`<div class="ph"><span class="ic">${icon}</span><div style="min-width:0"><div class="eb">${eb}</div><h2>${esc(title)}</h2><div class="ad">${sub}</div></div><div class="act">${act}</div></div>`;
const fr=(icon,name,sub,n,pillTxt,pillCls,attrs='')=>`<div class="fr${attrs?' click':''}" ${attrs}><span class="fi">${icon}</span><span class="nm"><b>${name}</b>${sub?`<small>${sub}</small>`:''}</span><span class="n num">${n}</span>${pillTxt?`<span class="pill ${pillCls}">${pillTxt}</span>`:''}</div>`;
function nextTrainRows(){ return [1,2].map(k=>{ const tr=TRAINS.filter(t=>t.pl===k&&t.state!=='depart').sort((a,b)=>b.s-a.s)[0]; const q=PL[k].queue[0];
  if(tr){ const [st,cls]=trainStatus(tr); const prog=tr.state==='dwell'?tr.dt/tr.dw:clamp(tr.s/STOP,0,1);
    return `<div class="fr click" data-sel="train:${tr.id}"><span class="fi">${I.train}</span><span class="nm"><b>${tr.id} → ${PL[k].to}</b><small>Platform ${k} · ${tr.state==='dwell'?`${Math.ceil(tr.dw-tr.dt)} s to departure`:`arrives in ${fmtDur(etaOf(tr))}`}</small></span><span class="mb"><div class="bar"><i class="${tr.state==='dwell'?'g':''}" style="width:${pct(prog)}%"></i></div></span><span class="pill ${cls}">${st}</span></div>`; }
  return `<div class="fr"><span class="fi">${I.train}</span><span class="nm"><b>${q.id} → ${PL[k].to}</b><small>Platform ${k} · due ${hm(q.sched)}</small></span><span class="pill">En route</span></div>`; }).join(''); }

function panelHTML(){
  const h=hourOf(SIM.t);
  if(SEL.kind==='station'){ const n=inStation(), busy=busyPl();
    return head('LRT Station · KJ24','Kelana Jaya','Kelana Jaya Line · Petaling Jaya, Selangor',I.station)
      +`<div class="prow"><span class="pill ok">Operational</span><span class="m">${busy}/2 platforms busy · ${TRAINS.filter(t=>t.state==='approach').length} arriving · ${trainsInHour(SIM.t)} trains/hr</span></div>`
      +`<div class="grid">${stat('Passengers in station',`${fmtN(n)} <small>/ ${fmtN(CAP_STN)}</small>`,n/CAP_STN)}${stat('Platforms busy',`${busy} <small>/ 2</small>`,busy/2,'g')}${stat('Departures today',fmtN(BASE.deps+STATS.dep))}${stat('Entries today',fmtN(BASE.entries+STATS.entries))}</div>`
      +`<div class="sec"><h4>Facilities<span>units in service</span></h4>${FAC_GROUPS.map(([t,l])=>{ const [a,b]=facCount(t); return fr(I[t],l,'',`${a}/${b}`,a===b?'In service':`${b-a} out`,a===b?'ok':'warn','data-sel="concourse"'); }).join('')}</div>`
      +`<div class="sec"><h4>Next trains<span>both platforms</span></h4>${nextTrainRows()}</div>`; }
  if(SEL.kind==='platform'){ const p=PL[SEL.id]; const [cw,cc]=crowd(p.wait); const tr=TRAINS.filter(t=>t.pl===p.id&&t.state!=='depart').sort((a,b)=>b.s-a.s)[0]; const q=p.queue[0];
    return head(`Platform ${p.id} · KJ24`,`To ${p.to}`,`Island platform · ${p.id===1?'Track 1 (northbound)':'Track 2 (southbound)'}`,I.platform,`<button data-x aria-label="Back to station">${I.close}</button>`)
      +`<div class="prow"><span class="pill ${cc}">${cw}</span><span class="m">${tr?`${tr.id} ${trainStatus(tr)[0].toLowerCase()}`:`next train ${hm(q.sched)}`}</span></div>`
      +`<div class="grid">${stat('Waiting now',fmtN(p.wait),p.wait/400,p.wait>=260?'r':p.wait>=120?'a':'g')}${stat('Headway',`${Math.round(headway(SIM.t)/60*10)/10} <small>min</small>`)}${stat('Next train',tr?(tr.state==='dwell'?'Boarding':fmtDur(etaOf(tr))):hm(q.sched))}${stat('Last departure',p.last?hm(p.last.t):'–')}</div>`
      +`<div class="sec"><h4>Upcoming<span>scheduled</span></h4>${[tr,...p.queue].filter(Boolean).slice(0,3).map(x=>x.obj?fr(I.train,x.id,`${x.state==='dwell'?'At platform':'Arriving'} · ${Math.round(x.load*100)}% load`,hm(x.sched),trainStatus(x)[0],trainStatus(x)[1],`data-sel="train:${x.id}"`):fr(I.train,x.id,`From ${STNS[p.id][1][1]}`,hm(x.sched),'En route','')).join('')}</div>`
      +`<div class="sec"><h4>Facilities on platform</h4>${FAC.filter(f=>f.id==='E3'||f.id==='E4'||f.id==='L2').map(f=>fr(I[f.type],f.name,f.where,'',f.ok?'Running':'Maintenance',f.ok?'ok':'warn')).join('')}</div>`; }
  if(SEL.kind==='train'){ const tr=TRAINS.find(t=>t.id===SEL.id); const q=[...PL[1].queue,...PL[2].queue].find(x=>x.id===SEL.id);
    if(!tr&&!q){ SEL={kind:'station'}; return panelHTML(); }
    const act=`<button data-follow aria-pressed="${FOLLOW}" aria-label="Follow train">${I.target}</button><button data-x aria-label="Back to station">${I.close}</button>`;
    if(!tr) return head('Kelana Jaya Line · 4 cars',q.id,`To ${PL[q.pl].to} · driverless`,I.train,`<button data-x aria-label="Back to station">${I.close}</button>`)+`<div class="prow"><span class="pill">En route</span><span class="m">Due at Platform ${q.pl} ${hm(q.sched)}</span></div><p class="hint">This train is still between stations. It appears on the viaduct about 30 s before arrival.</p>`;
    const [st,cls]=trainStatus(tr); const ph=tr.state==='dwell'?dwellPhase(tr):-1;
    return head('Kelana Jaya Line · 4 cars',tr.id,`To ${PL[tr.pl].to} · driverless (UTO)`,I.train,act)
      +`<div class="prow"><span class="pill ${cls}">${st}</span><span class="m">Platform ${tr.pl} · ${tr.state==='dwell'?`${Math.ceil(tr.dw-tr.dt)} s left`:tr.state==='approach'?`in ${fmtDur(etaOf(tr))}`:`left ${hm(tr.depAt)}`}</span></div>`
      +`<div class="grid">${stat('Speed',`${Math.round(tr.v*3.6)} <small>km/h</small>`,tr.v/VMAX)}${stat('Load',`${pct(tr.load)}<small>%</small>`,tr.load,tr.load>.85?'r':tr.load>.65?'a':'g')}${stat('Delay',tr.arrAt!=null?fmtDelay(tr.delay):fmtDelay(tr.delay))}${stat('Scheduled',hm(tr.sched))}</div>`
      +(ph>=0?`<div class="sec"><h4>Dwell at KJ24<span>${Math.ceil(tr.dw-tr.dt)} s left</span></h4><div class="dw">${PHASES.map((p,i)=>`<div class="${i<ph?'done':i===ph?'on':''}"><i></i>${p.replace('Doors ','')}</div>`).join('')}</div></div>`:'')
      +`<div class="sec"><h4>Passengers</h4>${fr(I.users,'Alighted here','',fmtN(tr.arrAt!=null?tr.alight:0),'',' ')}${fr(I.users,'Boarded here','',fmtN(tr.boarded),'',' ')}</div>`; }
  if(SEL.kind==='concourse'){ const n=STATS.flow+ENTRY_RATE*demand(h)*45;
    return head('Concourse · KJ24','Concourse & entrances','Paid & unpaid areas · Entrances A (south), B (north)',I.station,`<button data-x aria-label="Back to station">${I.close}</button>`)
      +`<div class="prow"><span class="pill ok">Open</span><span class="m">${Math.round(ENTRY_RATE*demand(h)*60)} gate taps/min</span></div>`
      +`<div class="grid">${stat('In concourse',fmtN(n))}${stat('Exits today',fmtN(BASE.entries*.97+STATS.exits))}</div>`
      +`<div class="sec"><h4>Facilities<span>${FAC.filter(f=>f.ok).length}/${FAC.length} in service</span></h4>${FAC.filter(f=>f.type==='esc'||f.type==='lift'||!f.ok).map(f=>fr(I[f.type],f.name,f.ok?f.where:f.note,'',f.ok?'Running':'Out of service',f.ok?'ok':'warn')).join('')}${fr(I.gate,'Fare gates','Paid area',facCount('gate').join('/'),'In service','ok')}${fr(I.ticket,'Ticket machines','Concourse',facCount('ticket').join('/'),'In service','ok')}</div>`; }
  if(SEL.kind==='bushub'||SEL.kind==='bus'){ const used=bayFree.filter(f=>!f).length;
    return head('Feeder bus hub · KJ24','Feeder bus hub','Bus lay-by beside Entrance A · 4 bays',I.bus,`<button data-x aria-label="Back to station">${I.close}</button>`)
      +`<div class="prow"><span class="pill ok">Operational</span><span class="m">${used}/4 bays in use</span></div>`
      +`<div class="grid">${stat('Bays in use',`${used} <small>/ 4</small>`,used/4)}${stat('Waiting at shelter',fmtN(12+demand(h)*40))}</div>`
      +`<div class="sec"><h4>Buses<span>simulated</span></h4>${BUSES.map(b=>fr(I.bus,`${b.id} · ${b.name.split(' · ')[0]}`,b.name.split(' · ')[1],b.state==='dwell'?`${Math.ceil(b.dw)} s`:'',busStatus(b),b.state==='dwell'?'ok':b.state==='off'?'':'info',b.state!=='off'?`data-sel="bus:${b.id}"`:'')).join('')}</div>`; }
  if(SEL.kind==='carpark'){ const o=carOcc(h); const msUsed=Math.round(o*MS_SPACES), lotUsed=Math.round(Math.min(1,o*1.05)*LOT_SPACES);
    return head('Park & Ride · KJ24','Park & Ride','Multi-storey (4 levels) + surface lot',I.car,`<button data-x aria-label="Back to station">${I.close}</button>`)
      +`<div class="prow"><span class="pill ${o>.9?'warn':'ok'}">${o>.9?'Nearly full':'Spaces available'}</span><span class="m">${fmtN(MS_SPACES+LOT_SPACES-msUsed-lotUsed)} free</span></div>`
      +`<div class="grid">${stat('Multi-storey',`${fmtN(msUsed)} <small>/ ${fmtN(MS_SPACES)}</small>`,msUsed/MS_SPACES,o>.9?'a':'')}${stat('Surface lot',`${fmtN(lotUsed)} <small>/ ${fmtN(LOT_SPACES)}</small>`,lotUsed/LOT_SPACES,o>.9?'a':'')}</div>`
      +`<div class="sec"><h4>Levels</h4>${[0,1,2,3].map(l=>{ const f=clamp(o*1.12-l*.06,0,1); return fr(I.car,l===0?'Ground':l===3?'Roof':`Level ${l}`,'',`${pct(f)}%`,f>.95?'Full':'Open',f>.95?'warn':'ok'); }).join('')}</div>`; }
  return '';
}

// tracker: the selected train, else the train that is (or is about to be) at the platform
function trackerTrain(){ if(SEL.kind==='train'){ const tr=TRAINS.find(t=>t.id===SEL.id)||[...PL[1].queue,...PL[2].queue].find(x=>x.id===SEL.id); if(tr) return tr; }
  const p=SEL.kind==='platform'?SEL.id:null; const c=TRAINS.filter(t=>t.state!=='depart'&&(!p||t.pl===p)).sort((a,b)=>(a.state==='dwell'?-1:etaOf(a))-(b.state==='dwell'?-1:etaOf(b)));
  return c[0]||(p?PL[p].queue[0]:[PL[1].queue[0],PL[2].queue[0]].sort((a,b)=>a.sched-b.sched)[0]); }
function renderTracker(){ const tr=trackerTrain(); if(!tr) return; const st=STNS[tr.pl]; const live=!!tr.obj; const T0=tr.sched+(tr.delay||0);
  const stepT=k=>k<2?T0-(2-k)*LEG:k===2?T0:(tr.depAt??(T0+(tr.dw||30)))+(k-2)*LEG;
  let on; if(!live) on=SIM.t<T0-LEG?1:2; else if(tr.state==='approach'||tr.state==='dwell') on=2; else on=3;
  $('trHead').textContent=`${tr.id} · to ${PL[tr.pl].to}`;
  $('steps').innerHTML=st.map(([code,name],k)=>{ const cls=k<on?'done':k===on?'on':''; let sub=hm(stepT(k));
    if(k===2&&on===2) sub=tr.state==='dwell'?`${PHASES[dwellPhase(tr)]} ${dwellPhase(tr)+1}/4`:`ETA ${hm(SIM.t+(live?etaOf(tr):T0-SIM.t))}`;
    return `<div class="step ${cls}"><i>${k<on?'✓':code.slice(2)}</i>${esc(name)}<small>${k===on&&k!==2?'Next · ':''}${sub}</small></div>`; }).join('');
  const [s,cls]=live?trainStatus(tr):['En route',''];
  $('tcard').dataset.sel=`train:${tr.id}`;
  $('tcard').innerHTML=`<span class="tim">${I.tram}</span><span style="min-width:0"><b>#${tr.id}</b><small>To: ${PL[tr.pl].to}</small><span class="pill ${cls}">${s}</span><small>Platform ${tr.pl} · ${live?(tr.state==='dwell'?`${Math.ceil(tr.dw-tr.dt)} s left`:tr.state==='approach'?`${fmtDur(etaOf(tr))} away`:`left ${hm(tr.depAt)}`):`due ${hm(tr.sched)}`}</small></span><span class="chev">${I.chev}</span>`; }

let TAB='trains';
function renderList(){ const tr=TRAINS.filter(t=>t.state!=='depart'||t.s<STOP+260), q=[...PL[1].queue,...PL[2].queue];
  const facOk=FAC.filter(f=>f.ok).length;
  $('seg').innerHTML=[['platforms','Platforms',`${busyPl()}/2`],['trains','Trains',tr.length+q.length],['facilities','Facilities',`${facOk}/${FAC.length}`]].map(([k,l,n])=>`<button role="tab" data-tab="${k}" aria-selected="${TAB===k}">${l}<span>${n}</span></button>`).join('');
  let h='';
  if(TAB==='trains'){ const rows=[...tr.map(t=>({t,live:true,k:t.state==='depart'?-1e6+t.s:t.state==='dwell'?-1e5:etaOf(t)})),...q.map(x=>({t:x,live:false,k:x.sched-SIM.t+1e3}))].sort((a,b)=>a.k-b.k);
    h=rows.map(({t,live})=>{ const [s,c]=live?trainStatus(t):['En route','']; const prog=live?(t.state==='dwell'?`<div class="bar"><i class="g" style="width:${pct(t.dt/t.dw)}%"></i></div>${dwellPhase(t)+1}/4`:t.state==='approach'?`<div class="bar"><i style="width:${pct(t.s/STOP)}%"></i></div>${fmtDur(etaOf(t))}`:'departed'):`due ${hm(t.sched)}`;
      const loc=live?(t.state==='depart'?`→ ${STNS[t.pl][3][1]}`:`KJ24 · Platform ${t.pl}`):`${STNS[t.pl][1][1]} → KJ24`;
      return `<div class="lr${SEL.kind==='train'&&SEL.id===t.id?' sel':''}" data-sel="train:${t.id}"><span><b>${t.id}</b><small>to ${PL[t.pl].to}</small></span><span class="loc"><i style="background:${t.pl===1?'#2F54EB':'#E0115F'}"></i>${loc}</span><span><span class="pill ${c}">${s}</span></span><span class="pr">${prog}</span></div>`; }).join(''); }
  else if(TAB==='platforms'){ h=[1,2].map(k=>{ const p=PL[k]; const [cw,cc]=crowd(p.wait); const t=TRAINS.find(x=>x.pl===k&&x.state==='dwell');
      return `<div class="lr${SEL.kind==='platform'&&SEL.id===k?' sel':''}" data-sel="platform:${k}"><span><b>Platform ${k}</b><small>to ${p.to}</small></span><span class="loc"><i style="background:${t?'#22C55E':'#C9CFDD'}"></i>${t?`${t.id} boarding`:'No train'}</span><span><span class="pill ${cc}">${cw}</span></span><span class="pr"><div class="bar"><i class="${cc==='ok'?'g':cc==='warn'?'a':'r'}" style="width:${pct(p.wait/400)}%"></i></div>${fmtN(p.wait)} waiting</span></div>`; }).join(''); }
  else { h=FAC.filter(f=>f.type==='esc'||f.type==='lift'||!f.ok).map(f=>`<div class="lr" data-sel="concourse"><span><b>${f.id}</b><small>${f.type==='esc'?'Escalator':f.type==='lift'?'Lift':f.type==='gate'?'Fare gate':'Machine'}</small></span><span class="loc"><i style="background:${f.ok?'#22C55E':'#F59E0B'}"></i>${f.where}</span><span><span class="pill ${f.ok?'ok':'warn'}">${f.ok?'Running':'Out'}</span></span><span class="pr">${f.ok?'':esc(f.note)}</span></div>`).join('')
      +`<div class="lr" data-sel="concourse"><span><b>Gates</b><small>Fare gates</small></span><span class="loc"><i style="background:#22C55E"></i>Paid area</span><span><span class="pill ok">${facCount('gate').join('/')}</span></span><span class="pr"></span></div>`; }
  $('rows').innerHTML=h; }

const KPI_HIST=[]; let lastK=0;
function renderKPIs(){ const n=inStation(); KPI_HIST.push([SIM.t,n]); while(KPI_HIST.length&&SIM.t-KPI_HIST[0][0]>300) KPI_HIST.shift();
  const dn=n-KPI_HIST[0][1]; $('kv1').textContent=fmtN(n); $('kd1').textContent=`${dn>=0?'↑':'↓'} ${fmtN(Math.abs(dn))}`; $('kd1').className='d'+(dn<0?' down':'');
  const th=trainsInHour(SIM.t), tp=trainsInHour(SIM.t-3600); $('kv2').textContent=th; $('kd2').textContent=`${th>=tp?'↑':'↓'} ${Math.abs(th-tp)}`; $('kd2').className='d'+(th<tp?' down':'');
  const ot=(BASE.ok+STATS.ok)/Math.max(1,BASE.arr+STATS.arr); $('kv3').textContent=`${(ot*100).toFixed(1)}%`; const dd=(ot-.98)*100; $('kd3').textContent=`${dd>=0?'↑':'↓'} ${Math.abs(dd).toFixed(1)}%`; $('kd3').className='d'+(dd<0?' down':'');
  $('siteSub').textContent=`${pct(n/CAP_STN)}% capacity · ${busyPl()}/2 platforms busy`;
  $('clock').textContent=`Live ${HMS.format(new Date(WALL0+SIM.t*1000))}`;
  const al=alerts(); $('bellN').hidden=!al.length; $('bellN').textContent=al.length; if(!$('alertPop').hidden) renderAlerts(); }
function renderAlerts(){ const a=alerts(); $('alertPop').innerHTML=`<div class="hd">Alerts</div>`+(a.length?a.map(x=>`<div class="alert"><i style="background:${x.c}"></i><b>${esc(x.t)}</b><span>${esc(x.s)}</span></div>`).join(''):`<div class="alert"><span>No active alerts</span></div>`); }
let lastPanel='';
function renderUI(force){ const p=panelHTML(); if(force||p!==lastPanel){ const sc=$('panel').scrollTop; $('panel').innerHTML=p; $('panel').scrollTop=sc; lastPanel=p; } renderTracker(); renderList(); renderKPIs(); }

// events
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sel]'); if(s){ const [kind,id]=s.dataset.sel.split(':'); select(id===undefined?{kind}:{kind,id:kind==='platform'?+id:id}); return; }
  if(e.target.closest('[data-x]')){ select({kind:'station'}); return; }
  if(e.target.closest('[data-follow]')){ FOLLOW=!FOLLOW; renderUI(true); return; }
  const t=e.target.closest('[data-tab]'); if(t){ TAB=t.dataset.tab; renderList(); return; }
  if(!e.target.closest('.pop,#siteBtn,#bellBtn,.search')) closePops(); });
function closePops(){ for(const id of ['sitePop','alertPop','qres']) $(id).hidden=true; }
const SITE_ITEMS=[[{kind:'station'},'Station overview','KJ24 Kelana Jaya'],[{kind:'platform',id:1},'Platform 1','to Gombak'],[{kind:'platform',id:2},'Platform 2','to Putra Heights'],[{kind:'concourse'},'Concourse & entrances','Entrances A · B'],[{kind:'bushub'},'Feeder bus hub','4 bays'],[{kind:'carpark'},'Park & Ride','Multi-storey + surface']];
$('siteBtn').onclick=e=>{ e.stopPropagation(); const p=$('sitePop'); const open=p.hidden; closePops(); if(!open) return;
  p.innerHTML='<div class="hd">Kelana Jaya station</div>'+SITE_ITEMS.map(([s,l,sub])=>`<button class="it${sameSel(s,SEL)?' on':''}" data-sel="${s.kind}${s.id?':'+s.id:''}"><span><b>${l}</b><small>${sub}</small></span></button>`).join('')+'<div class="hd">Data shown is simulated</div>'; p.hidden=false; };
$('bellBtn').onclick=e=>{ e.stopPropagation(); const open=$('alertPop').hidden; closePops(); if(open){ renderAlerts(); $('alertPop').hidden=false; } };
function searchItems(q){ q=q.trim().toLowerCase(); if(!q) return [];
  const all=[...TRAINS.map(t=>[`train:${t.id}`,t.id,`to ${PL[t.pl].to} · ${trainStatus(t)[0]}`]),...[...PL[1].queue,...PL[2].queue].map(t=>[`train:${t.id}`,t.id,`to ${PL[t.pl].to} · en route`]),
    ...SITE_ITEMS.map(([s,l,sub])=>[`${s.kind}${s.id?':'+s.id:''}`,l,sub]),...FAC.filter(f=>f.type==='esc'||f.type==='lift').map(f=>['concourse',f.name,f.where]),...BUSES.map(b=>[b.state==='off'?'bushub':`bus:${b.id}`,`${b.id} ${b.name}`,'Feeder bus'])];
  return all.filter(([,a,b])=>(a+' '+b).toLowerCase().includes(q)).slice(0,10); }
$('q').addEventListener('input',()=>{ const r=searchItems($('q').value); const box=$('qres'); box.innerHTML=r.length?r.map(([s,a,b])=>`<button class="it" data-sel="${s}"><span><b>${esc(a)}</b><small>${esc(b)}</small></span></button>`).join(''):`<div class="it"><small>No matches</small></div>`; box.hidden=!$('q').value.trim(); });
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const r=searchItems($('q').value); if(r[0]){ $('qres').querySelector('[data-sel]').click(); $('q').value=''; $('q').blur(); } } if(e.key==='Escape'){ $('q').value=''; closePops(); $('q').blur(); } });
addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); } if(e.key==='Escape') closePops(); });
$('zIn').onclick=()=>{ const s=sph(); flyTo(controls.target.toArray(),Math.max(controls.minDistance,s.r*.7),null,null,.5); };
$('zOut').onclick=()=>{ const s=sph(); flyTo(controls.target.toArray(),Math.min(controls.maxDistance,s.r/.7),null,null,.5); };
$('rL').onclick=()=>{ const s=sph(); flyTo(controls.target.toArray(),s.r,s.az-Math.PI/4,null,.7); };
$('rR').onclick=()=>{ const s=sph(); flyTo(controls.target.toArray(),s.r,s.az+Math.PI/4,null,.7); };
$('home').onclick=()=>{ select({kind:'station'},{move:false}); flyTo(HOME.t,HOME.r,HOME.az,HOME.pol); };
controls.autoRotateSpeed=.8;
$('cine').onclick=()=>{ controls.autoRotate=!controls.autoRotate; $('cine').setAttribute('aria-pressed',controls.autoRotate); if(controls.autoRotate){ select({kind:'station'},{move:false}); const s=sph(); flyTo(HOME.t,HOME.r,s.az,.9,1.2); } };

/* =====================================================================
   FRAME LOOP
   ===================================================================== */
const _o={}, _c=new THREE.Vector3(), _b=new THREE.Box3(), _prev=new THREE.Vector3();
let last=performance.now(), uiT=0, roofOp=1;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  const steps=Math.ceil(dt/.05); for(let i=0;i<steps;i++) simStep(dt/steps);

  // trains
  for(const tr of TRAINS){ const g=tr.obj.g, p=PL[tr.pl]; g.position.set(trainX(tr),DECK+.42,TRACK_Z[tr.pl]); g.rotation.y=p.dir>0?0:Math.PI;
    const open=tr.state==='dwell'?clamp(Math.min(tr.dt/2,(tr.dw-tr.dt-1)/2),0,1):0;
    for(const l of tr.obj.leaves) l.position.x=l.userData.x0+l.userData.s*open*.72; }
  for(const b of BUSES) placeBus(b);
  // parked cars by occupancy
  const o=carOcc(hourOf(SIM.t)); const nPark=Math.round(o*SPACES.length); PARKED.b.count=PARKED.c.count=SPACES.length;
  SPACES.order.forEach((si,rank)=>{ const s=SPACES[si]; if(s.vis!==(rank<nPark)){ s.vis=rank<nPark; _m.makeScale(s.vis?1:0,s.vis?1:0,s.vis?1:0).setPosition(s.x,s.y,s.z); if(s.vis){ _q.setFromEuler(_e.set(0,s.yaw,0)); _m.compose(_p.set(s.x,s.y,s.z),_q,_s.set(1,1,1)); } PARKED.b.setMatrixAt(si,_m); PARKED.c.setMatrixAt(si,_m); PARKED.b.instanceMatrix.needsUpdate=PARKED.c.instanceMatrix.needsUpdate=true; } });
  for(const p of PINS){ p.position.y=p.userData.y+Math.sin(now/500+p.position.x)*.35; p.rotation.y+=dt*.6; }

  // camera: fly animation, follow
  if(fly){ fly.k=Math.min(1,fly.k+dt/fly.dur); const e=ease(fly.k); const t=_c.lerpVectors(fly.t0,fly.t1,e); const r=lerp(fly.r0,fly.r1,e), az=lerp(fly.a0,fly.a1,e), pol=lerp(fly.p0,fly.p1,e); placeCam(t.toArray(),r,az,pol); if(fly.k>=1) fly=null; }
  if((SEL.kind==='train'||SEL.kind==='bus')&&FOLLOW&&!fly){ const b=selBox(SEL,_b); if(b){ b.getCenter(_c); _prev.set(_c.x-controls.target.x,0,_c.z-controls.target.z); controls.target.add(_prev); camera.position.add(_prev); } }
  controls.update();
  // a followed train that has left the map hands the view back to the station
  if(SEL.kind==='train'&&!TRAINS.some(t=>t.id===SEL.id)&&![...PL[1].queue,...PL[2].queue].some(q=>q.id===SEL.id)){ select({kind:'station'},{move:false}); flyTo(HOME.t,HOME.r,HOME.az,HOME.pol); }
  if(SEL.kind==='bus'&&BUSES.find(b=>b.id===SEL.id)?.state==='off') select({kind:'bushub'});

  // roof fades when looking closely at platform-level things
  const want=(sph().r<200||SEL.kind==='platform'||SEL.kind==='train')?0:1; roofOp=lerp(roofOp,want,Math.min(1,dt*5)); roofMat.opacity=roofOp; roofMat.depthWrite=roofOp>.95; roof.visible=roofOp>.03; roof.castShadow=roofOp>.5;

  // shadows follow the view
  const tg=controls.target; const sx=Math.round(tg.x/20)*20, sz=Math.round(tg.z/20)*20; sun.target.position.set(sx,0,sz); sun.position.set(sx+SUN_OFF.x,SUN_OFF.y,sz+SUN_OFF.z);

  // selection visuals
  const sb_=selBox(SEL,_b);
  if(sb_&&SEL.kind!=='station'){ bracket.visible=glow.visible=true; setBracket(sb_); const sz2=sb_.getSize(_v); glow.scale.set(sz2.x+2,sz2.z+2,1); glow.position.set((sb_.min.x+sb_.max.x)/2,sb_.min.y+.08,(sb_.min.z+sb_.max.z)/2);
    const [a,b]=nameOf(SEL); selChip.element.innerHTML=`${esc(a)} <span>${esc(b)}</span>`; selChip.position.set((sb_.min.x+sb_.max.x)/2,sb_.max.y+.5,(sb_.min.z+sb_.max.z)/2); selChip.visible=true; }
  else { bracket.visible=glow.visible=false; selChip.visible=false; }
  const hb=hov&&!sameSel(hov,SEL)?selBox(hov,new THREE.Box3()):null;
  if(hb){ const [a,b]=nameOf(hov); hovChip.element.innerHTML=`${esc(a)} <span>${esc(b)}</span>`; hovChip.position.set((hb.min.x+hb.max.x)/2,hb.max.y+.5,(hb.min.z+hb.max.z)/2); hovChip.visible=true; } else hovChip.visible=false;

  renderer.render(scene,camera);
  renderer.autoClear=false; renderer.clearDepth(); renderer.render(overlay,camera); renderer.autoClear=true;
  labels.render(scene,camera);
  uiT+=dt; if(uiT>.25){ uiT=0; renderUI(false); }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labels.setSize(innerWidth,innerHeight); bMat.resolution.set(innerWidth,innerHeight); });
renderUI(true);
requestAnimationFrame(t=>{ last=t; frame(t); setTimeout(()=>{ $('loader').style.opacity=0; setTimeout(()=>$('loader').remove(),400); },150); });
</script>
